<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <style>
      .outline { fill: none; stroke: #000; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .detail  { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .bone    { fill: #fff; stroke: #000; stroke-width: 3; stroke-linejoin: round; }
      .cavity  { fill: #000; }
      .label   { font-family: "Helvetica, Arial, sans-serif"; font-size: 16px; fill: #555; letter-spacing: 2px; }
      .sign    { font-family: "Brush Script MT, cursive"; font-size: 18px; fill: #888; }
    </style>
  </defs>

  <!-- Crown / parietal + temporal wings -->
  <path class="bone" d="
