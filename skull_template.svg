    C 120 575 130 590 130 610
    C 130 625 138 635 150 640
    C 160 645 170 660 175 680
    C 180 700 195 720 220 730
    C 240 738 260 740 280 735
    L 285 800
    C 290 830 320 850 360 855
    L 440 855
    C 480 850 510 830 515 800
    L 520 735
    C 540 740 560 738 580 730
    C 605 720 620 700 625 680
    C 630 660 640 645 650 640
    C 662 635 670 625 670 610
    C 670 590 680 575 690 565
    C 705 565 720 558 730 552
    C 745 560 765 560 780 555
    C 760 540 745 520 740 500
    C 735 480 740 465 750 460
    C 770 450 785 435 792 410
    C 800 380 795 350 780 320
    C 760 285 730 270 700 260
    C 670 250 650 225 635 195
    C 620 160 600 125 570 95
    C 530 55 470 30 400 30
    Z"/>

  <!-- Inner cranial cavity (cut-out) -->
  <path class="cavity" d="
    M 400 80
    C 340 80 290 100 250 135
    C 225 160 210 195 205 230
    C 200 265 185 300 160 320
    C 140 335 125 360 130 385
    C 135 410 155 425 180 425
    C 210 425 235 410 250 385
    C 260 410 280 430 305 435
    C 330 440 355 430 370 405
    C 385 420 415 420 430 405
    C 445 430 470 440 495 435
    C 520 430 540 410 550 385
    C 565 410 590 425 620 425
    C 645 425 665 410 670 385
    C 675 360 660 335 640 320
    C 615 300 600 265 595 230
    C 590 195 575 160 550 135
    C 510 100 460 80 400 80
    Z"/>

  <!-- Left eye socket -->
  <path class="outline" d="
    M 280 540
    C 300 525 340 520 370 535
    C 385 545 390 560 385 575
    C 375 600 340 615 310 610
    C 285 605 270 580 275 560
    Z"/>
  <!-- Right eye socket -->
  <path class="outline" d="
    M 520 540
    C 500 525 460 520 430 535
    C 415 545 410 560 415 575
    C 425 600 460 615 490 610
    C 515 605 530 580 525 560
    Z"/>

  <!-- Brow ridges -->
  <path class="detail" d="M 270 520 C 300 500 350 495 385 515"/>
  <path class="detail" d="M 530 520 C 500 500 450 495 415 515"/>

  <!-- Nasal cavity (heart-shaped) -->
  <path class="outline" d="
    M 400 600
    C 380 590 365 600 365 620
    C 365 645 385 670 400 690
    C 415 670 435 645 435 620
    C 435 600 420 590 400 600
    Z"/>
  <!-- Nostrils -->
  <path class="detail" d="M 388 660 L 388 690 M 412 660 L 412 690"/>

  <!-- Cheekbones -->
  <path class="detail" d="M 270 600 C 260 640 270 680 295 710"/>
  <path class="detail" d="M 530 600 C 540 640 530 680 505 710"/>

  <!-- Maxilla line -->
  <path class="detail" d="M 320 710 C 360 720 440 720 480 710"/>

  <!-- Upper teeth -->
  <g class="detail">
    <path d="M 320 720 L 320 760"/>
    <path d="M 345 722 L 345 765"/>
    <path d="M 370 723 L 370 768"/>
    <path d="M 395 724 L 395 770"/>
    <path d="M 420 724 L 420 770"/>
    <path d="M 445 723 L 445 768"/>
    <path d="M 470 722 L 470 765"/>
    <path d="M 495 720 L 495 760"/>
  </g>
  <!-- Tooth arch outline -->
  <path class="outline" d="
    M 310 715
    C 305 745 315 775 340 790
    C 370 805 430 805 460 790
    C 485 775 495 745 490 715
    C 460 725 340 725 310 715
    Z"/>

  <!-- Temporal lines (sides) -->
  <path class="detail" d="M 175 380 C 165 430 170 480 190 520"/>
  <path class="detail" d="M 625 380 C 635 430 630 480 610 520"/>

  <!-- Serrated side spikes left (temple / ear region) -->
  <g class="outline">
    <path d="M 100 460 L 40 470 L 95 490"/>
    <path d="M  90 500 L 25 515 L 85 530"/>
    <path d="M  85 545 L 15 560 L 80 575"/>
    <path d="M  85 585 L 25 605 L 80 615"/>
  </g>
  <!-- Serrated side spikes right -->
  <g class="outline">
    <path d="M 700 460 L 760 470 L 705 490"/>
    <path d="M 710 500 L 775 515 L 715 530"/>
    <path d="M 715 545 L 785 560 L 720 575"/>
    <path d="M 715 585 L 775 605 L 720 615"/>
  </g>

  <!-- Frontal (top crown spikes) -->
  <g class="outline">
    <path d="M 330 60 L 320 10 L 360 45"/>
    <path d="M 380 40 L 385 -10 L 410 35"/>
    <path d="M 440 45 L 470 5 L 480 60"/>
    <path d="M 270 90 L 240 40 L 285 80"/>
    <path d="M 530 90 L 560 40 L 515 80"/>
  </g>

  <!-- Labels / branding -->
  <text class="sign" x="90" y="300" transform="rotate(-75 90 300)">by Alex</text>
  <text class="sign" x="700" y="620" transform="rotate(75 700 620)">by Alex</text>

  <g transform="translate(395 660) rotate(-90)">
    <ellipse cx="0" cy="0" rx="55" ry="18" class="detail"/>
    <text class="label" x="0" y="5" text-anchor="middle">FRONTAL</text>
  </g>

  <!-- Manufacturer style badge on cheek -->
  <g transform="translate(560 680) rotate(-20)">
    <ellipse cx="0" cy="0" rx="55" ry="22" class="detail"/>
    <text class="label" x="0" y="-3" text-anchor="middle" font-size="11">ARTOOL</text>
    <text class="label" x="0" y="13" text-anchor="middle" font-size="8">STUDIO</text>
  </g>

  <!-- Small crosshair / anchor points -->
  <g class="detail" opacity="0.5">
    <line x1="400" y1="20" x2="400" y2="40"/>
    <line x1="390" y1="30" x2="410" y2="30"/>
    <line x1="400" y1="840" x2="400" y2="860"/>
    <line x1="390" y1="850" x2="410" y2="850"/>
    <line x1="10"  y1="300" x2="30"  y2="300"/>
    <line x1="20"  y1="290" x2="20"  y2="310"/>
    <line x1="770" y1="300" x2="790" y2="300"/>
    <line x1="780" y1="290" x2="780" y2="310"/>
  </g>
</svg>
